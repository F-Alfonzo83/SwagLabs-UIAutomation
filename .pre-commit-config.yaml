repos:
  - repo: local
    hooks:
      - id: autopep8                    #This is the ID of thetool
        name: Autopep8                  #This is how it will be displayed
        entry: autopep8 --in-place      #Entry  equals the command executed
        language: system                # This  denotes that it will be run onthe system
        types: [python]

      - id: flake8
        name:  Flake8
        entry: flake8
        language: system
        types: [python]

      - id: bandit
        name: Bandit
        entry: bandit -s B101
        language: system
        types: [python]
